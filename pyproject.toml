[project]
name = "tradewind"
version = "0.1.0"
description = "Deterministic verification and evaluation harness for LLM trading agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Installed only when driving the vendored TradingAgents framework (Phase 6).
# The core harness must never import from this extra.
tradingagents = []

[project.scripts]
tradewind = "tradewind.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradewind"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The vendored TradingAgents submodule is read-only; never lint or format it.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "C4",             # comprehensions
    "SIM",            # simplify
    "RUF",            # ruff-specific
    "D",              # docstrings
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D105",  # docstrings on magic methods add noise
    "D107",  # __init__ contract belongs in the class docstring
    # Docstrings and error messages intentionally use typographic punctuation
    # (en-dashes for ranges, … for truncated hashes); these are not typos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tradewind"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/tradewind"]

[tool.coverage.report]
show_missing = true
