[project]
name = "tradewind"
version = "0.1.0"
description = "Deterministic verification and evaluation harness for LLM trading agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Installed only when driving the vendored TradingAgents framework (Phase 6):
# the adapter needs langchain-core/langgraph, plus an editable install of the
# pinned submodule (pip install -e third_party/TradingAgents), plus a provider
# API key — for RECORDING only. Replay never needs any of this.
# The core harness must never import from this extra.
tradingagents = [
    "langchain-core>=0.3",
    "langgraph>=0.4",
]
# The MCP server (tradewind.mcp) — optional; handlers work without it.
mcp = [
    "mcp>=1.2",
]

[project.scripts]
tradewind = "tradewind.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    # So CI exercises the MCP server wiring without secrets.
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradewind"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The vendored TradingAgents submodule is read-only; never lint or format it.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "C4",             # comprehensions
    "SIM",            # simplify
    "RUF",            # ruff-specific
    "D",              # docstrings
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D105",  # docstrings on magic methods add noise
    "D107",  # __init__ contract belongs in the class docstring
    # Docstrings and error messages intentionally use typographic punctuation
    # (en-dashes for ranges, … for truncated hashes); these are not typos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
# The HTML/CSS templates are long inline strings that cannot be wrapped.
"src/tradewind/report/render.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tradewind"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional heavy dependencies, imported lazily behind the extras; not installed
# in the default dev environment or CI.
module = ["langchain_core.*", "langgraph.*", "tradingagents.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# This module subclasses LangChain's BaseChatModel, which is Any when the
# extra is absent; allow that one pattern without weakening anything else.
module = ["tradewind.adapters.tradingagents.boundary_model"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/tradewind"]

[tool.coverage.report]
show_missing = true
